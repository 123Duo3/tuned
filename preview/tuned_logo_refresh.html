<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuned Canvas Logo Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      background: #f4fbf9;
      color: #163735;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 36%, #ffffff 0 12rem, transparent 32rem),
        #f4fbf9;
    }

    main {
      width: min(92vw, 760px);
      display: grid;
      gap: 26px;
      justify-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -0.04em;
      font-weight: 680;
    }

    p {
      margin: -16px 0 0;
      color: #54706e;
      font-size: 15px;
      text-align: center;
      line-height: 1.5;
    }

    .search {
      width: min(100%, 620px);
      height: 82px;
      display: grid;
      place-items: center;
      border: 1px solid #b7cfcc;
      border-radius: 41px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 18px 48px rgba(0, 106, 101, 0.1);
      backdrop-filter: blur(12px);
    }

    canvas {
      width: 200px;
      height: 48px;
      display: block;
    }

    .controls {
      width: min(100%, 620px);
      display: grid;
      gap: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .control-row.range {
      display: grid;
      grid-template-columns: 92px 1fr 56px;
    }

    .label,
    output {
      color: #54706e;
      font-size: 13px;
      font-weight: 600;
    }

    output {
      color: #006a65;
      text-align: right;
    }

    .button-group {
      display: flex;
      overflow: hidden;
      border: 1px solid #b7cfcc;
      border-radius: 999px;
      background: #ffffff;
    }

    button {
      padding: 9px 16px;
      border: 0;
      background: transparent;
      color: #21423f;
      cursor: pointer;
      font: inherit;
    }

    button:hover { background: #e9f6f4; }

    button.active {
      background: #006a65;
      color: #ffffff;
    }

    input[type="range"] {
      accent-color: #006a65;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tuned Canvas wave</h1>
    <p>新 logo 的 Compose Canvas 镜像。前沿接近下一环后，平滑完成替代并保持。</p>

    <div class="search" aria-label="Tuned search refresh preview">
      <canvas id="logoCanvas"></canvas>
    </div>

    <section class="controls" aria-label="Animation controls">
      <div class="control-row">
        <div class="button-group">
          <button id="icon" type="button">图标</button>
          <button class="active" id="animate" type="button">动画</button>
        </div>
        <div class="button-group">
          <button id="replay" type="button">重播</button>
        </div>
      </div>

      <label class="control-row range">
        <span class="label">传递速度</span>
        <input id="propagation" type="range" min="0.25" max="4" step="0.05" value="0.75">
        <output id="propagationValue">0.75x</output>
      </label>

      <label class="control-row range">
        <span class="label">下拉距离</span>
        <input id="pull" type="range" min="0" max="3" step="0.05" value="0">
        <output id="pullValue">0.00x</output>
      </label>

      <div class="control-row">
        <button id="release" type="button">松手刷新</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#logoCanvas");
    const context = canvas.getContext("2d");
    const designWidth = 200;
    const designHeight = 48;
    const cycleDuration = 1400;
    const startEasingDuration = 650;
    const stopEasingDuration = 1600;
    const minimumPhaseDistance = 0.0001;
    const maximumPullBacktrack = 1.25;
    const pullResistance = 1.5;
    const ringSpacing = 20.5;
    const innerRadius = 35.5;
    const outerRadius = 199.5;
    const innerStrokeWidth = 9;
    const peakApproach = 0.98;
    const pulseRange = 10;
    const waveCenter = { x: -15, y: 24 };
    const enteringRingIndex = -2;
    const exitingRingIndex = 10;
    const lastVisibleRingIndex = 8;
    const clipPath = [
      { x: 205, y: 6.44 },
      { x: 205, y: 41.56 },
      { x: -15, y: 24 },
    ];

    let baselineProgress = 0;
    let pulseProgress = 0;
    let waveStrength = 0;
    let lastTime = 0;
    let waveState = "icon";
    let transitionElapsed = 0;
    let transitionStartStrength = 0;
    let remainingPulseDistance = 0;
    let stopStartBaseline = 0;
    let stopBaselineDistance = 1;
    let stopBaselineInitialTangent = 0;
    let propagationSpeed = 0.75;
    let pullDistance = 0;

    const lerp = (start, stop, fraction) => start + (stop - start) * fraction;
    const wrapProgress = (progress) => progress % 1;
    const pullBacktrack = (distance) => maximumPullBacktrack
      * distance / (pullResistance + distance);

    // Equivalent to Compose FastOutSlowInEasing: cubic-bezier(.4, 0, .2, 1).
    function fastOutSlowIn(progress) {
      const x1 = 0.4;
      const x2 = 0.2;
      let low = 0;
      let high = 1;
      for (let iteration = 0; iteration < 12; iteration += 1) {
        const t = (low + high) / 2;
        const x = 3 * (1 - t) * (1 - t) * t * x1
          + 3 * (1 - t) * t * t * x2
          + t * t * t;
        if (x < progress) low = t;
        else high = t;
      }
      const t = (low + high) / 2;
      return 3 * (1 - t) * t * t + t * t * t;
    }

    function pulseOffset(ringIndex, baselineProgress, pulseProgress) {
      const pulseCenter = lerp(-pulseRange, lastVisibleRingIndex + pulseRange, pulseProgress);
      const ringPosition = ringIndex + baselineProgress;
      const handoff = Math.max(0, Math.min(1, (pulseCenter - ringPosition) / pulseRange + 0.5));
      if (handoff <= 0.5) {
        return ringSpacing * peakApproach * fastOutSlowIn(handoff * 2);
      }
      return ringSpacing * (
        peakApproach
          + (1 - peakApproach) * fastOutSlowIn((handoff - 0.5) * 2)
      );
    }

    function cubicHermite(start, end, startTangent, progress) {
      const progressSquared = progress * progress;
      const progressCubed = progressSquared * progress;
      return (2 * progressCubed - 3 * progressSquared + 1) * start
        + (progressCubed - 2 * progressSquared + progress) * startTangent
        + (-2 * progressCubed + 3 * progressSquared) * end;
    }

    const distanceToFollowingCycle = (progress) => progress <= minimumPhaseDistance
      ? 1
      : 1 - progress;

    function beginBaselineSettle() {
      waveState = "stopping";
      transitionElapsed = 0;
      transitionStartStrength = waveStrength;
      stopStartBaseline = baselineProgress;
      stopBaselineDistance = distanceToFollowingCycle(stopStartBaseline);
      stopBaselineInitialTangent = Math.min(
        transitionStartStrength * stopEasingDuration / cycleDuration,
        3 * stopBaselineDistance,
      );
    }

    function setWaveTarget(isAnimating) {
      if (isAnimating) {
        if (waveState === "active" || waveState === "starting") return;
        waveState = "starting";
        transitionElapsed = 0;
        transitionStartStrength = waveStrength;
      } else {
        if (waveState === "pulling") {
          setPullDistance(0);
          document.querySelector("#pull").value = "0";
          document.querySelector("#pullValue").textContent = "0.00x";
          return;
        }
        if (waveState === "icon" || waveState === "finishing" || waveState === "stopping") return;
        waveState = "finishing";
        transitionElapsed = 0;
        transitionStartStrength = waveStrength;
        remainingPulseDistance = distanceToFollowingCycle(pulseProgress);
      }
      document.querySelector("#icon").classList.toggle("active", !isAnimating);
      document.querySelector("#animate").classList.toggle("active", isAnimating);
    }

    function setPullDistance(distance) {
      pullDistance = distance;
      if (waveState !== "icon" && waveState !== "pulling") return;
      baselineProgress = -pullBacktrack(pullDistance);
      pulseProgress = 0;
      waveStrength = 0;
      waveState = pullDistance === 0 ? "icon" : "pulling";
    }

    function updateWave(deltaMillis) {
      if (waveState === "icon" || waveState === "pulling") return;

      if (waveState === "starting") {
        transitionElapsed += deltaMillis;
        const progress = Math.min(1, transitionElapsed / startEasingDuration);
        waveStrength = lerp(transitionStartStrength, 1, fastOutSlowIn(progress));
        baselineProgress = wrapProgress(baselineProgress + deltaMillis / cycleDuration * waveStrength);
        pulseProgress = wrapProgress(
          pulseProgress + deltaMillis / cycleDuration * propagationSpeed * waveStrength,
        );
        if (progress === 1) waveState = "active";
        return;
      }

      if (waveState === "active") {
        baselineProgress = wrapProgress(baselineProgress + deltaMillis / cycleDuration);
        pulseProgress = wrapProgress(
          pulseProgress + deltaMillis / cycleDuration * propagationSpeed,
        );
        waveStrength = 1;
        return;
      }

      if (waveState === "finishing") {
        transitionElapsed += deltaMillis;
        const progress = Math.min(1, transitionElapsed / startEasingDuration);
        waveStrength = lerp(transitionStartStrength, 1, fastOutSlowIn(progress));
        const baselineDelta = deltaMillis / cycleDuration * waveStrength;
        const pulseDelta = baselineDelta * propagationSpeed;
        const appliedFraction = Math.min(1, remainingPulseDistance / pulseDelta);
        baselineProgress = wrapProgress(baselineProgress + baselineDelta * appliedFraction);
        pulseProgress = wrapProgress(pulseProgress + pulseDelta * appliedFraction);
        remainingPulseDistance -= pulseDelta * appliedFraction;
        if (remainingPulseDistance <= 0) {
          pulseProgress = 0;
          beginBaselineSettle();
        }
        return;
      }

      transitionElapsed += deltaMillis;
      const stopProgress = Math.min(1, transitionElapsed / stopEasingDuration);
      waveStrength = transitionStartStrength * (1 - stopProgress);
      baselineProgress = wrapProgress(
        cubicHermite(
          stopStartBaseline,
          stopStartBaseline + stopBaselineDistance,
          stopBaselineInitialTangent,
          stopProgress,
        ),
      );
      pulseProgress = 0;
      if (stopProgress === 1) {
        baselineProgress = 0;
        pulseProgress = 0;
        waveStrength = 0;
        waveState = "icon";
      }
    }

    function edgeOpacity(radius) {
      const fadeIn = Math.max(0, Math.min(1, (radius - (innerRadius - ringSpacing)) / ringSpacing));
      const fadeOut = Math.max(0, Math.min(1, ((outerRadius + ringSpacing) - radius) / ringSpacing));
      return fastOutSlowIn(Math.min(fadeIn, fadeOut));
    }

    function strokeWidth(radius) {
      return Math.max(0.5, innerStrokeWidth - (radius - innerRadius) / ringSpacing);
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
    }

    function drawFrame(time) {
      if (lastTime === 0) lastTime = time;
      updateWave(time - lastTime);
      lastTime = time;
      const scale = Math.min(canvas.width / designWidth, canvas.height / designHeight);
      const dx = (canvas.width - designWidth * scale) / 2;
      const dy = (canvas.height - designHeight * scale) / 2;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.save();
      context.translate(dx, dy);
      context.scale(scale, scale);
      context.beginPath();
      context.moveTo(clipPath[0].x, clipPath[0].y);
      context.lineTo(clipPath[1].x, clipPath[1].y);
      context.lineTo(clipPath[2].x, clipPath[2].y);
      context.closePath();
      context.clip();

      for (let ringIndex = enteringRingIndex; ringIndex <= exitingRingIndex; ringIndex += 1) {
        const radius = innerRadius
          + (ringIndex + baselineProgress) * ringSpacing
          + pulseOffset(ringIndex, baselineProgress, pulseProgress);
        if (radius <= 0) continue;
        const opacity = edgeOpacity(radius);
        if (opacity <= 0) continue;

        context.beginPath();
        context.arc(waveCenter.x, waveCenter.y, radius, 0, 2 * Math.PI);
        context.globalAlpha = opacity;
        context.strokeStyle = "#006a65";
        context.lineWidth = strokeWidth(radius);
        context.stroke();
      }

      context.restore();
      requestAnimationFrame(drawFrame);
    }

    document.querySelector("#icon").addEventListener("click", () => setWaveTarget(false));
    document.querySelector("#animate").addEventListener("click", () => setWaveTarget(true));
    document.querySelector("#replay").addEventListener("click", () => {
      baselineProgress = 0;
      pulseProgress = 0;
      waveStrength = 0;
      waveState = "icon";
      setWaveTarget(true);
    });
    document.querySelector("#pull").addEventListener("input", (event) => {
      const distance = Number(event.currentTarget.value);
      setPullDistance(distance);
      document.querySelector("#pullValue").textContent = `${distance.toFixed(2)}x`;
    });
    document.querySelector("#release").addEventListener("click", () => {
      pullDistance = 0;
      document.querySelector("#pull").value = "0";
      document.querySelector("#pullValue").textContent = "0.00x";
      setWaveTarget(true);
    });
    document.querySelector("#propagation").addEventListener("input", (event) => {
      propagationSpeed = Number(event.currentTarget.value);
      document.querySelector("#propagationValue").textContent = `${propagationSpeed.toFixed(2)}x`;
    });

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    setWaveTarget(true);
    requestAnimationFrame(drawFrame);
  </script>
</body>
</html>
